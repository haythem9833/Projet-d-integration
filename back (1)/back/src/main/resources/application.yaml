# yaml-language-server: $schema=https://json.schemastore.org/yaml
server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/elearning?useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
app:
  jwt:
    secret: mySuperSecretKeyForJwt123456789
    expiration: 86400000